substitutions:
  name: "everything-presence-one"
  friendly_name: "Everything Presence One"
  temperature_offset: "-3"
  humidity_offset: "5"
  temperature_update_interval: "60s"
  illuminance_update_interval: "2s"
  hidden_ssid: "false"
  factory_reset_disabled: "true"
  uart_target_output_disabled: "true"
  uart_presence_output_disabled: "true"
  log_level: "DEBUG"


  device_config:
    ethernet_enabled: false
    co2_enabled: true
    bluetooth_enabled: false
    board_revision: "1.6"
    sensor_variant: "sen0395"
    wifi_power_profile: "wifi11"
    firmware_channel: "stable-wifi11"
    model: "everything-presence-one"

update:
  - platform: http_request
    id: update_http_request
    name: Everything Presence One Firmware
    source: https://everythingsmarthome.github.io/everything-presence-one/everything-presence-one-ha-sen0395-co2-noble-rev1-6-stable-wifi11-manifest.json
    disabled_by_default: true

dashboard_import:
  package_import_url: github://everythingsmarthome/everything-presence-one/everything-presence-one-co2-rev1.6-wifi11.yaml@main
  import_full_config: false

packages:
  wifi_power: !include common/wifi-power-11.yaml
  device_base: !include common/everything-presence-one-base.yaml
  device_version: !include common/everything-presence-one-sen0395-stable.yaml
  sen0395_base: !include common/sen0395-common.yaml
  co2_base: !include common/modules/co2-rev1.5.yaml

binary_sensor:
  - platform: gpio
    pin:
      number: 33
      mode: INPUT
    name: PIR
    id: !extend pir_motion_sensor 